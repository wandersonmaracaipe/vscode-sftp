name: CI

# Verificação contínua: compila, checa tipos, lint e testes em cada push nas
# branches principais e em cada pull request.

on:
  push:
    branches: [develop, main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Instalar servidor FTP de teste (para os testes de integração)
        run: npm i --no-save ftp-srv@^4.6.3

      - name: Testes de integração (SFTP/FTP)
        run: npm run test:integration

      - name: Compilar (build de produção)
        run: npm run compile
